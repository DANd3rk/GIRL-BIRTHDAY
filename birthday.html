<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday, My Golden Star ✨</title>

  <link rel="stylesheet" href="birthday.css">
</head>

<body>

  <main class="birthday-scene">

    <!-- Background stars -->
    <div class="star-background" id="starBackground"></div>

    <!-- Countdown -->
    <section class="countdown-section" id="countdownSection">

      <div class="countdown-number" id="countdownNumber">
        3
      </div>

      <p class="countdown-text">
        From Your King and your sis...
      </p>

    </section>

    <!-- Birthday Reveal -->
    <section class="birthday-reveal" id="birthdayReveal">

      <div class="birthday-content">

        <div class="birthday-title">

          <h1 class="happy" id="happyText">
            HAPPY
          </h1>

          <h1 class="birthday" id="birthdayText">
            BIRTHDAY!
          </h1>

        </div>

        <div class="birthday-heart" id="birthdayHeart">
          ❤️
        </div>

        <h2 class="birthday-name">
          My Golden Star, Mi Amor ✨
        </h2>

        <p class="birthday-message">
          The world became a little brighter
          the day you were born.
        </p>

        <!-- Birthday Cartoon GIF -->
        <div class="birthday-cartoon" id="birthdayCartoon">

          <img
            src="assets/happy-birthday.gif"
            alt="Cute cartoon celebrating a birthday"
            id="birthdayGif"
          >

          <!-- Fallback cartoon if no GIF is added yet -->
          <div class="cartoon-fallback" id="cartoonFallback">
            <div class="cartoon-bear">🧸</div>
            <div class="cartoon-cake">🎂</div>
            <div class="cartoon-celebration">🎉 ✨ 🎈</div>
          </div>

        </div>

        <button class="next-button" id="nextButton">
          The Birthday's queen's secret ✨
        </button>

      </div>

    </section>

    <!-- Confetti -->
    <div class="confetti-container" id="confettiContainer"></div>

  </main>

  <script src="birthday.js"></script>

</body>
</html>
