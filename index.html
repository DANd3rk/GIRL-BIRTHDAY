
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Golden Star ✨</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="invitation">
    <div class="stars" id="stars"></div>

    <h1 class="title">My Golden Star ✨</h1>

    <p class="subtitle">
      A little something for someone special...
    </p>

    <button class="envelope" id="envelope"
            aria-label="Open birthday invitation">

      <span class="envelope-flap"></span>

      <span class="letter">
        <span class="bear">🧸⭐</span>
        <span class="letter-text">Psst... scroll down!</span>
      </span>

      <span class="envelope-front"></span>

      <span class="envelope-seal">♥</span>
    </button>

    <p class="hint">Tap the envelope to open your surprise</p>

    <div class="opened-message" id="openedMessage">
      <h2>For my Oyindamola ❤️</h2>
      <p>
        Today, the universe celebrates you.
      </p>
      <button id="continueBtn">Continue ✨</button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
